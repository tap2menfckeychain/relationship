<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Celebrating Our Friendship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Oswald:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            background: #2b2522;
            background-image: 
                radial-gradient(circle at 10% 10%, #3a322e 2px, transparent 2px),
                radial-gradient(circle at 90% 90%, #3a322e 2px, transparent 2px);
            background-size: 50px 50px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* =========================================
           TRANG 1: MÀN HÌNH CHỜ (HỘP THƯ)
        ========================================= */
        #page1 {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #a88d77 0%, #6e5541 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease, transform 1s ease;
        }

        .mailbox {
            font-size: 5.5rem;
            cursor: pointer;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4));
            animation: pulseMail 1.5s infinite ease-in-out;
            transition: transform 0.3s;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .mailbox:active { transform: scale(0.9); }

        .hint-text {
            margin-top: 25px;
            color: #fff;
            font-size: 1.3rem;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.6);
        }

        @keyframes pulseMail {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* =========================================
           TRANG 2: SCRAPBOOK
        ========================================= */
        #page2 {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            background: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), #322b26;
        }

        .doodle {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            font-family: sans-serif;
            z-index: 0;
            pointer-events: none;
        }
        .doodle-1 { top: 8%; left: 10%; font-size: 3rem; transform: rotate(15deg); }
        .doodle-2 { bottom: 25%; right: 5%; font-size: 2.5rem; } 
        .doodle-3 { top: 40%; right: 15%; font-size: 4rem; font-family: 'Caveat'; transform: rotate(-20deg); }
        .doodle-4 { bottom: 12%; left: 8%; font-size: 2.5rem; transform: rotate(-10deg); } 

        .lace-corner {
            position: absolute;
            width: 150px; height: 150px;
            background: radial-gradient(circle, transparent 30%, rgba(240,235,225,0.7) 35%, transparent 40%);
            background-size: 20px 20px;
            opacity: 0.6;
            z-index: 1;
        }
        .lace-top-left { top: -20px; left: -20px; border-radius: 50%; }
        .lace-bottom-right { bottom: -20px; right: -20px; border-radius: 50%; }

        .scrapbook-wrapper {
            position: absolute;
            inset: 0;
            transform: rotate(-2.5deg); 
            transform-origin: center;
            z-index: 2;
        }

        .scrapbook-folder {
            position: absolute;
            top: 7%; bottom: 7%; left: 12%; right: 10%;
            background: #b59275;
            border-radius: 12px 0 0 12px;
            box-shadow: -5px 10px 25px rgba(0,0,0,0.7), inset 2px 0 10px rgba(255,255,255,0.2);
            z-index: 2;
            overflow: hidden;
        }

        .rose-sketch {
            position: absolute;
            top: 5%; left: 0%; 
            width: 100%; 
            height: auto;
            opacity: 0.25;
            mix-blend-mode: multiply; 
            z-index: 3;
            pointer-events: none;
        }

        .folder-tab {
            position: absolute;
            left: -18px;
            width: 30px; height: 60px;
            background: #8e6d55;
            border-radius: 10px 0 0 10px;
            box-shadow: -3px 2px 5px rgba(0,0,0,0.3);
            z-index: 1;
        }
        .tab1 { top: 15%; background: #a67c5c; }
        .tab2 { top: 40%; background: #614d3f; }
        .tab3 { top: 75%; background: #504035; }

        .beige-tab {
            position: absolute;
            right: -5%; top: 9%; bottom: 9%; width: 40px;
            background: #d4c5b3; 
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .binder-rings {
            position: absolute;
            right: 0%; top: 9%; bottom: 9%;
            width: 30px;
            display: flex; flex-direction: column;
            justify-content: space-evenly; align-items: center;
            z-index: 15;
        }
        .ring {
            width: 45px; height: 12px;
            background: linear-gradient(to bottom, #f0f0f0, #999, #f0f0f0);
            border-radius: 6px;
            box-shadow: 3px 5px 6px rgba(0,0,0,0.6), inset 1px 1px 3px rgba(255,255,255,0.9);
            transform: translateX(5px);
        }
        .ring::before {
            content: ''; position: absolute; left: -10px; top: -5px;
            width: 16px; height: 22px; background: #222;
            border-radius: 50%; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.9);
        }

        .locket {
            position: absolute; 
            top: 0%; 
            border-radius: 50%; border: 3px solid #888;
            background: #111; box-shadow: 2px 4px 8px rgba(0,0,0,0.6);
            z-index: 5; overflow: hidden;
        }
        .locket img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            opacity: 0.8; 
            filter: grayscale(100%); 
        }
        .locket1 { 
            left: 28%; 
            transform: rotate(-10deg); 
            width: 95px; height: 70px; 
        }
        .locket2 { 
            left: 52%; 
            transform: rotate(15deg); 
            width: 110px; height: 85px; 
        }

        /* =========================================
           KHUNG MEDIA & ẢNH
        ========================================= */
        
        .main-media-frame {
            position: absolute;
            top: 7%; 
            left: 22%; 
            width: 230px; height: 310px; 
            background: #e9e1d5;
            padding: 10px;
            border: 6px dashed #d6c6b6;
            border-radius: 8px;
            box-shadow: 4px 6px 15px rgba(0,0,0,0.5);
            transform: rotate(-3deg);
            z-index: 10; 
            cursor: pointer;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .main-media-frame video {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 4px;
            transition: border-radius 0.8s ease;
        }
        
        .clip-art {
            position: absolute;
            top: -12px; left: 15px;
            width: 18px; height: 45px;
            border: 2px solid #silver; border-color: #999;
            border-radius: 10px;
            box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
            transform: rotate(-15deg);
            z-index: 12;
            transition: opacity 0.4s;
        }

        /* ----- Chuyển Tap2me Lên Góc Trên ----- */
        .tap-text {
            position: absolute;
            top: -15px; /* Đổi lên viền trên */
            right: 5px;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #d14769;
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 12px;
            border-radius: 10px;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
            transform: rotate(8deg); /* Nghiêng ra ngoài */
            z-index: 15;
            animation: bounceHint 1.5s infinite;
            pointer-events: none; 
            transition: opacity 0.4s;
        }

        @keyframes bounceHint {
            0%, 100% { transform: rotate(8deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(-5px); }
        }

        .small-photo {
            position: absolute;
            top: 35%; 
            left: 10%; 
            width: 110px; height: 145px; 
            background: #fff; padding: 5px;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.6);
            transform: rotate(-22deg); 
            z-index: 9; 
            transition: opacity 0.5s;
        }
        .small-photo img { width: 100%; height: 100%; object-fit: cover; filter: sepia(0.3); }

        /* ----- Dịch khung Polaroid xuống 1 xíu ----- */
        .polaroid-photo {
            position: absolute;
            top: 43%; /* Dịch xuống dưới */
            left: 45%; /* Nhích nhẹ sang phải */
            width: 185px; height: 220px; 
            background: #fdfdfd;
            padding: 8px 8px 45px 8px; 
            box-shadow: -3px -3px 15px rgba(0,0,0,0.4), 3px 6px 15px rgba(0,0,0,0.6);
            transform: rotate(7deg);
            z-index: 11; 
            transition: opacity 0.5s;
        }
        .polaroid-photo img { width: 100%; height: 100%; object-fit: cover; border: 1px solid #eee;}

        /* =========================================
           THẺ ID CARD 
        ========================================= */
        .id-card-wrapper {
            position: absolute;
            bottom: 16%; 
            left: 14%; 
            right: 17%; 
            height: 155px; 
            z-index: 15;
            transition: all 0.8s ease;
            transform: rotate(-1.5deg); 
        }

        .id-card {
            position: absolute; inset: 0;
            background: #fefcf5;
            border-radius: 8px;
            padding: 10px 14px 28px 14px; 
            box-shadow: 3px 8px 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            border: 1px solid #d4c5b3;
            transition: opacity 0.6s ease;
        }

        .id-card.card2 { opacity: 0; } 

        .id-header {
            text-align: center;
            font-size: 1.1rem;
            border-bottom: 2px solid #ccc;
            padding-bottom: 4px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .id-header.love { color: #b32d2d; font-family: 'Cormorant Garamond', serif; font-weight: bold;}
        .id-header.bff { color: #444; font-family: 'Oswald', sans-serif;}

        .id-body { display: flex; gap: 12px; align-items: center; } 
        
        .id-photo {
            width: 65px; height: 75px; flex-shrink: 0;
            background: #fff; padding: 4px;
            border: 1px solid #ddd;
        }
        .id-photo img { width: 100%; height: 100%; object-fit: cover; }
        
        .id-details { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden;}
        .id-title { background: #777; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; align-self: flex-start; margin-bottom: 2px;}
        
        .id-row { 
            display: flex; flex-direction: row; align-items: baseline; 
            border-bottom: 1.5px dashed #b5a999; 
            padding-bottom: 2px;
            width: 100%; 
        }
        .id-row strong { 
            font-size: 0.7rem; color: #555; width: 75px; flex-shrink: 0;
        }
        .id-row span { 
            font-family: 'Caveat', cursive; 
            font-size: 1.45rem; 
            color: #111; 
            transform: translateY(2px); white-space: nowrap;
        }

        .binder-clip {
            position: absolute;
            bottom: -5px; right: 15px;
            width: 30px; height: 15px; background: #111;
            border-radius: 2px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.5);
            transform: rotate(15deg);
            z-index: 25;
        }
        .binder-clip::before, .binder-clip::after {
            content: ''; position: absolute; width: 25px; height: 20px;
            border: 2px solid silver; border-radius: 50% 50% 0 0;
            top: -20px; left: 1px; z-index: -1;
        }
        .binder-clip::after { transform: rotateX(60deg) translateY(-5px); }

        .grey-ticket {
            position: absolute;
            bottom: -5px; left: -10px;
            background: #a3a6a4; padding: 6px 12px;
            color: #fff; font-size: 0.7rem; line-height: 1.1;
            text-align: center; transform: rotate(-10deg);
            box-shadow: 2px 4px 8px rgba(0,0,0,0.4);
            border: 1px dashed #e0e0e0;
            z-index: 20; transition: opacity 0.5s;
        }

        /* =========================================
           STATE: EXPANDED (KHI CLICK VIDEO PHÓNG TO)
        ========================================= */
        #page2.is-expanded .main-media-frame {
            width: 88%; height: 48%;
            top: 10%; left: 6%;
            transform: rotate(2.5deg); 
            z-index: 30; 
            
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            padding: 6px;
            border: 4px solid rgba(255,255,255,0.9);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 30px rgba(251, 194, 235, 0.5);

            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morphingBlob 5s ease-in-out infinite alternate;
        }

        #page2.is-expanded .main-media-frame video {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            animation: morphingBlob 5s ease-in-out infinite alternate;
        }

        @keyframes morphingBlob {
            0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
            100% { border-radius: 40% 50% 60% 50% / 70% 40% 50% 60%; }
        }

        #page2.is-expanded .clip-art,
        #page2.is-expanded .tap-text,
        #page2.is-expanded .small-photo,
        #page2.is-expanded .polaroid-photo,
        #page2.is-expanded .grey-ticket {
            opacity: 0; pointer-events: none;
        }

        #page2.is-expanded .id-card-wrapper {
            bottom: 12%; left: 14%; right: 17%;
            transform: rotate(3deg);
            z-index: 35;
        }
        #page2.is-expanded .id-card.card1 { opacity: 0; }
        #page2.is-expanded .id-card.card2 { opacity: 1; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="page1">
            <button class="mailbox" onclick="openScrapbook()">💌</button>
            <div class="hint-text">Chạm để mở lưu bút</div>
        </div>

        <div id="page2">
            <div class="doodle doodle-1">✧</div>
            <div class="doodle doodle-2">♡</div>
            <div class="doodle doodle-3">〰️</div>
            <div class="doodle doodle-4">⋆⁺₊⋆</div>

            <div class="lace-corner lace-top-left"></div>
            <div class="lace-corner lace-bottom-right"></div>
            
            <div class="scrapbook-wrapper">
                
                <div class="folder-tab tab1"></div>
                <div class="folder-tab tab2"></div>
                <div class="folder-tab tab3"></div>
                
                <div class="scrapbook-folder">
                    <img src="https://i.pinimg.com/736x/c9/2e/7e/c92e7ec4f85e493394a10f8231cd8fa6.jpg" class="rose-sketch" alt="Rose">
                </div>
                
                <div class="beige-tab"></div>

                <div class="binder-rings">
                    <div class="ring"></div><div class="ring"></div>
                    <div class="ring"></div><div class="ring"></div>
                    <div class="ring"></div><div class="ring"></div>
                </div>

                <div class="locket locket1">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=200&q=80" alt="Locket 1">
                </div>
                <div class="locket locket2">
                    <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=200&q=80" alt="Locket 2">
                </div>

                <div class="main-media-frame" onclick="toggleExpand()">
                    <div class="clip-art"></div>
                    <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted playsinline></video>
                    <div class="tap-text">Tap2me</div>
                </div>

                <div class="small-photo">
                    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200&q=80">
                </div>

                <div class="polaroid-photo">
                    <img src="https://images.unsplash.com/photo-1502444330042-d1a1ddf971b1?w=300&q=80">
                </div>

                <div class="id-card-wrapper">
                    
                    <div class="id-card card1">
                        <div class="id-header love">♡ I LOVE YOU FOREVER! ♡</div>
                        <div class="id-body">
                            <div class="id-photo"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200&q=80"></div>
                            <div class="id-details">
                                <div class="id-title">(IDENTIFICATION CARD)</div>
                                <div class="id-row"><strong>NAME</strong><span>Ten</span></div>
                                <div class="id-row"><strong>DATE OF BIRTH</strong><span>2025</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="id-card card2">
                        <div class="id-header bff">(100%) BEST FRIENDS CLUB</div>
                        <div class="id-body">
                            <div class="id-photo"><img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200&q=80"></div>
                            <div class="id-details">
                                <div class="id-title">(IDENTIFICATION CARD)</div>
                                <div class="id-row"><strong>NAME</strong><span>Gabriella</span></div>
                                <div class="id-row"><strong>DATE OF BIRTH</strong><span>2025</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="binder-clip"></div>
                </div>

                <div class="grey-ticket">
                    CELEBRATING<br>OUR FRIENDSHIP
                </div>

            </div> 
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        function openScrapbook() {
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const music = document.getElementById('bg-music');

            page1.style.opacity = '0';
            page1.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                page1.style.display = 'none';
                page2.style.opacity = '1';
                page2.style.pointerEvents = 'auto';
                music.play().catch(e => console.log("Cần tương tác để phát nhạc"));
            }, 800);
        }

        function toggleExpand() {
            const page2 = document.getElementById('page2');
            page2.classList.toggle('is-expanded');
        }
    </script>
</body>
</html>
